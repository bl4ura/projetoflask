<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário de Professor</title>
  <!-- Bootstrap: o visual vem pronto, pela internet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <h1 class="h3 mb-3">Formulário de Professor</h1>

        <div class="card shadow-sm">
          <div class="card-body">
            <form action="/professor/salvar" method="post">

              <!-- id: vazio no cadastro; preenchido na edição (próxima aula) -->
              <input type="hidden" name="id" value="{{ professor.id if professor else '' }}">
			  
			  

              <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome"
                       value="{{ professor.nome if professor else '' }}" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="text" class="form-control" id="email" name="email"
                       value="{{ professor.email if professor else '' }}" required>
              </div>

              <div class="mb-3">
                <label for="titulação" class="form-label">Titulação</label>
                <input type="text" class="form-control" id="titulacao" name="titulacao"
                       value="{{ professor.titulacao if professor else '' }}" required>
              </div>


              <button type="submit" class="btn btn-primary">Salvar</button>
              <a href="/professor/" class="btn btn-outline-secondary">Cancelar</a>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
