<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>
</head>
<body>
    <h1>Tabuada do {{ numero }}</h1>
    <ul>
    {% for i in range(1, 11) %}
        <li>{{ numero }} x {{ i }} = {{ numero * i }}</li>
    {% endfor %}
    </ul>
    <a href="/">Voltar ao início</a>
</body>
</html>
