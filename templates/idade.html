<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idade</title>
</head>
<body>
    <h1>Você tem {{ idade }} anos</h1>
    
    {% if idade >= 18 %}
        <p>Você é maior de idade.</p>
    {% else %}
        <p>Você é menor de idade.</p>
    {% endif %}
    
    <a href="/">Voltar ao início</a>
</body>
</html>
