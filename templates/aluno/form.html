<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário de Aluno</title>
  <!-- Bootstrap: o visual vem pronto, pela internet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <h1 class="h3 mb-3">Formulário de Aluno</h1>

        <div class="card shadow-sm">
          <div class="card-body">
            <form action="/aluno/salvar" method="post">

              <!-- id: vazio no cadastro; preenchido na edição (próxima aula) -->
              <input type="hidden" name="id" value="{{ aluno.id if aluno else '' }}">
			  
			  

              <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome"
                       value="{{ aluno.nome if aluno else '' }}" required>
              </div>

              <div class="mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefone" name="telefone"
                       value="{{ aluno.telefone if aluno else '' }}" required>
              </div>

              <div class="mb-3">
                <label for="cidade" class="form-label">Cidade</label>
                <input type="text" class="form-control" id="cidade" name="cidade"
                       value="{{ aluno.cidade if aluno else '' }}" required>
              </div>



              <button type="submit" class="btn btn-primary">Salvar</button>
              <a href="/aluno/" class="btn btn-outline-secondary">Cancelar</a>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
